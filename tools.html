<body>
<header class="site-header">

<section class="tools-hero">
  <div class="container">
    <h1>AI 工具导航</h1>
    <p class="tools-lede">32 个我们筛过的真实工具，按场景分类，支持搜索与筛选。</p>
    <div class="search-box">
      <div class="search-field">
        <input id="search" type="search" autocomplete="off" aria-label="搜索 AI 工具" placeholder="搜索工具名、厂商或功能，如「图像」「编程」「国内」…">
        <span class="search-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg></span>
      </div>
    </div>
    <div class="filter-chips" id="filters" role="group" aria-label="按分类筛选工具"></div>
    <div class="ad-slot">
      <strong>广告位</strong> · 此处预留 AdSense / 联盟广告位，流量起来后接入
    </div>
    <div class="tool-grid" id="grid"></div>
    <div class="empty" id="empty" role="status" aria-live="polite" style="display:none;">没有匹配的工具，换个关键词试试。</div>
  </div>
</section>

<footer class="site-footer">

    Learntide · 学习潮汐 — 内容站（信息流动）。© 2026 · <a href="about.html">关于本站</a>
  </div>
</footer>

<script>
const TOOLS = [
  {n:"ChatGPT",v:"OpenAI",d:"通用对话与写作，GPT-4o 多模态，Plus 订阅可用。",c:"对话AI",t:["热门"]},
  {n:"Claude",v:"Anthropic",d:"长文本与严谨写作见长，Claude 3.5 系列。",c:"对话AI",t:[]},
  {n:"Gemini",v:"Google",d:"原生多模态，免费额度友好，2.5 系列推理强。",c:"对话AI",t:["免费"]},
  {n:"Kimi",v:"月之暗面",d:"长上下文中文对话，适合读长文档与资料整理。",c:"对话AI",t:["国内","免费"]},
  {n:"文心一言",v:"百度",d:"中文对话与文生图一体化，国内访问稳定。",c:"对话AI",t:["国内"]},

  {n:"Midjourney",v:"Midjourney",d:"高质量图像生成，经 Discord 调用，风格化强。",c:"图像生成",t:["热门"]},
  {n:"Stable Diffusion",v:"开源社区",d:"可本地部署的开源文生图，自由度高、可控。",c:"图像生成",t:[]},
  {n:"DALL·E 3",v:"OpenAI",d:"集成于 ChatGPT 的文生图，语义理解准确。",c:"图像生成",t:[]},
  {n:"即梦",v:"字节跳动",d:"中文图像与视频生成，中文提示词友好。",c:"图像生成",t:["国内","NEW"]},
  {n:"可灵",v:"快手",d:"图像与视频生成，运动连贯性较好。",c:"图像生成",t:["国内","NEW"]},

  {n:"GitHub Copilot",v:"GitHub/微软",d:"IDE 内代码补全与对话，支持多语言。",c:"编程助手",t:["热门"]},
  {n:"Cursor",v:"Anysphere",d:"AI 原生代码编辑器，跨文件理解与改写。",c:"编程助手",t:["热门"]},
  {n:"Claude Code",v:"Anthropic",d:"终端内的编码 agent，可执行与多步改文件。",c:"编程助手",t:["NEW"]},
  {n:"通义灵码",v:"阿里",d:"中文代码助手，IDE 插件，国内可用。",c:"编程助手",t:["国内","免费"]},
  {n:"Codeium",v:"Codeium",d:"免费代码补全，支持多编辑器。",c:"编程助手",t:["免费"]},

  {n:"Notion AI",v:"Notion",d:"文档内写作、总结与问答，协作一体化。",c:"写作文案",t:[]},
  {n:"秘塔写作猫",v:"秘塔",d:"中文校对、改写与写作辅助。",c:"写作文案",t:["国内"]},
  {n:"Grammarly",v:"Grammarly",d:"英文语法与语气润色，写作插件成熟。",c:"写作文案",t:[]},
  {n:"Jasper",v:"Jasper",d:"面向营销团队的长文与广告文案生成。",c:"写作文案",t:[]},
  {n:"火山写作",v:"字节跳动",d:"中文写作与改写，国内访问稳定。",c:"写作文案",t:["国内","免费"]},

  {n:"Suno",v:"Suno",d:"文本生成完整歌曲，含人声与伴奏。",c:"音视频",t:["热门"]},
  {n:"ElevenLabs",v:"ElevenLabs",d:"高质量 AI 配音与语音克隆。",c:"音视频",t:[]},
  {n:"Runway",v:"Runway",d:"视频生成与智能编辑，Gen 系列能力强。",c:"音视频",t:[]},
  {n:"HeyGen",v:"HeyGen",d:"数字人口播与多语言视频换脸配音。",c:"音视频",t:[]},
  {n:"剪映 AI",v:"字节跳动",d:"视频剪辑内的 AI 字幕、成片与特效。",c:"音视频",t:["国内","免费"]},

  {n:"Perplexity",v:"Perplexity",d:"带引用的 AI 搜索，适合研究与事实查询。",c:"商业效率",t:["热门"]},
  {n:"Poe",v:"Quora",d:"聚合多模型的对话入口，按需切换。",c:"商业效率",t:[]},
  {n:"飞书智能伙伴",v:"字节跳动",d:"企业协作内的 AI，会议纪要、文档与流程。",c:"商业效率",t:["国内"]},
  {n:"钉钉 AI",v:"阿里",d:"企业办公 AI 助理，审批、文档与群聊总结。",c:"商业效率",t:["国内","免费"]},

  {n:"通义千问",v:"阿里",d:"开源多模态大模型，API 与对话均可用。",c:"国内专区",t:["国内","免费"]},
  {n:"腾讯混元",v:"腾讯",d:"通用与行业大模型，国内企业场景。",c:"国内专区",t:["国内"]},
  {n:"豆包",v:"字节跳动",d:"免费中文助手，App 与网页均可用。",c:"国内专区",t:["国内","免费"]}
];

const CATS = ["全部","对话AI","图像生成","编程助手","写作文案","音视频","商业效率","国内专区"];
let active = "全部";
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const search = document.getElementById("search");

const filters = document.getElementById("filters");
const catButtons = CATS.map(c=>{
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c;
  b.setAttribute("aria-pressed", String(c === active));
  if(c === active) b.classList.add("active");
  b.addEventListener("click", ()=>{
    active = c;
    catButtons.forEach(x=>{
      const on = x === b;
      x.classList.toggle("active", on);
      x.setAttribute("aria-pressed", String(on));
    });
    render();
  });
  filters.appendChild(b);
  return b;
});

const TAG_CLASS = {"热门":"hot","免费":"free","NEW":"new","国内":"cn"};

function esc(s){
  return String(s).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function render(){
  const q = search.value.trim().toLowerCase();
  const list = TOOLS.filter(t=>{
    const catOk = active === "全部" || t.c === active;
    const qOk = !q || (t.n + t.v + t.d + t.c).toLowerCase().includes(q);
    return catOk && qOk;
  });
  grid.innerHTML = list.map(t=>`
    <div class="tool-card">
      <div class="name">${esc(t.n)}</div>
      <div class="vendor">${esc(t.v)}</div>
      <div class="desc">${esc(t.d)}</div>
      <div class="tags">${t.t.map(x=>`<span class="tag ${TAG_CLASS[x] || ""}">${esc(x)}</span>`).join("")}</div>
    </div>`).join("");
  empty.style.display = list.length ? "none" : "block";
}
search.addEventListener("input", render);
render();
</script>
</body>
</html>
